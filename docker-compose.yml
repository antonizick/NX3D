version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      TENANTS_ROOT: /app/tenants
      TOTP_ISSUER: ${TOTP_ISSUER:-CustomWolf}
    volumes:
      - tenants_data:/app/tenants
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app

volumes:
  tenants_data:
  caddy_data:
  caddy_config:

networks:
  internal:
